<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Better YouTube Subtitles</title>
		<style id="better-yt-style"></style>
		<meta name="manifest.open_in_tab" content="true">
		<script type="module" crossorigin src="/chunks/options-JX10HmNE.js"></script>
		<link rel="stylesheet" crossorigin href="/assets/options-D0fArqNG.css">
	</head>
	<body>
		<h3>Better YouTube Subtitles <span id="version"></span></h3>
		<p id="headerInfo">
		</p><table>
			<colgroup>
				<col style="width: 50%">
				<col style="width: 50%">
			</colgroup>
			<tbody>
				<tr>
					<td><h3 id="headerFont"></h3></td>
				</tr>
				<tr>
					<td><label for="fontFamilyPref"></label></td>
					<td>
						<input class="option" id="fontFamilyPref" type="checkbox">
						<input class="option" id="fontFamily" type="text" placeholder="Arial" data-parent="fontFamilyPref" list="fontList">
						<datalist id="fontList"></datalist>
					</td>
				</tr>
				<tr>
					<td><label for="fontSizePref"></label></td>
					<td>
						<input class="option" id="fontSizePref" type="checkbox">
						<input class="option" id="fontSize" type="range" min="50" max="300" step="5" data-parent="fontSizePref">
						<output id="fontSizeOutput" for="fontSize" name="%" data-parent="fontSizePref">
					</output></td>
				</tr>
				<tr>
					<td><label for="fontWeightPref"></label></td>
					<td>
						<input class="option" id="fontWeightPref" type="checkbox">
						<select class="option" id="fontWeight" data-parent="fontWeightPref">
							<option id="fontWeightThin" value="100">
							</option><option id="fontWeightExtraLight" value="200">
							</option><option id="fontWeightLight" value="300">
							</option><option id="fontWeightNormal" value="400">
							</option><option id="fontWeightMedium" value="500">
							</option><option id="fontWeightSemiBold" value="600">
							</option><option id="fontWeightBold" value="700">
							</option><option id="fontWeightExtraBold" value="800">
							</option><option id="fontWeightBlack" value="900">
							</option><option id="fontWeightExtraBlack" value="950">
						</option></select>
					</td>
				</tr>
				<tr>
					<td><label for="fontColorPref"></label></td>
					<td>
						<input class="option" id="fontColorPref" type="checkbox">
						<input class="option" id="fontColor" type="color" data-parent="fontColorPref">
					</td>
				</tr>
				<tr>
					<td><label for="fontOpacityPref"></label></td>
					<td>
						<input class="option" id="fontOpacityPref" type="checkbox">
						<input class="option" id="fontOpacity" type="range" min="0" max="100" data-parent="fontOpacityPref">
						<output id="fontOpacityOutput" for="fontOpacity" name="%" data-parent="fontOpacityPref">
					</output></td>
				</tr>
				<tr>
					<td><h3 id="headerEffects"></h3></td>
				</tr>
				<tr>
					<td><label for="effectLetterSpacingPref"></label></td>
					<td>
						<input class="option" id="effectLetterSpacingPref" type="checkbox">
						<input class="option" id="effectLetterSpacing" type="range" min="0" max="0.25" step="0.01" data-parent="effectLetterSpacingPref">
						<output id="effectLetterSpacingOutput" for="effectLetterSpacing" name="x" data-parent="effectLetterSpacingPref">
					</output></td>
				</tr>
				<tr>
					<td><label for="effectWordSpacingPref"></label></td>
					<td>
						<input class="option" id="effectWordSpacingPref" type="checkbox">
						<input class="option" id="effectWordSpacing" type="range" min="0" max="0.5" step="0.01" data-parent="effectWordSpacingPref">
						<output id="effectWordSpacingOutput" for="effectWordSpacing" name="x" data-parent="effectWordSpacingPref">
					</output></td>
				</tr>
				<tr>
					<td><label for="effectLineHeightPref"></label></td>
					<td>
						<input class="option" id="effectLineHeightPref" type="checkbox">
						<input class="option" id="effectLineHeight" type="range" min="0" max="250" step="10" data-parent="effectLineHeightPref">
						<output id="effectLineHeightOutput" for="effectLineHeight" name="%" data-parent="effectLineHeightPref">
					</output></td>
				</tr>
				<tr>
					<td><label for="effectTextVertPosition"></label></td>
					<td>
						<select class="option" id="effectTextVertPosition">
							<option id="effectTextVertPositionDefault" value="default">
							</option><option id="effectTextVertPositionTop" value="top">
							</option><option id="effectTextVertPositionCenter" value="center">
							</option><option id="effectTextVertPositionBottom" value="bottom">
						</option></select>
					</td>
				</tr>
				<tr>
					<td><label for="effectTextHorPosition"></label></td>
					<td>
						<select class="option" id="effectTextHorPosition">
							<option id="effectTextHorPositionDefault" value="default">
							</option><option id="effectTextHorPositionLeft" value="left">
							</option><option id="effectTextHorPositionCenter" value="center">
							</option><option id="effectTextHorPositionRight" value="right">
						</option></select>
					</td>
				</tr>
				<tr>
					<td><label for="effectTextVertMarginPref"></label></td>
					<td>
						<input class="option" id="effectTextVertMarginPref" type="checkbox">
						<input class="option" id="effectTextVertMargin" type="range" min="0" max="12.5" step="1.25" data-parent="effectTextVertMarginPref">
						<output id="effectTextVertMarginOutput" for="effectTextVertMargin" name="x" data-parent="effectTextVertMarginPref">
					</output></td>
				</tr>
				<tr>
					<td><label for="effectTextHorMarginPref"></label></td>
					<td>
						<input class="option" id="effectTextHorMarginPref" type="checkbox">
						<input class="option" id="effectTextHorMargin" type="range" min="0" max="12.5" step="1.25" data-parent="effectTextHorMarginPref">
						<output id="effectTextHorMarginOutput" for="effectTextHorMargin" name="x" data-parent="effectTextHorMarginPref">
					</output></td>
				</tr>
				<tr>
					<td><label for="effectTextTransform"></label></td>
					<td>
						<select class="option" id="effectTextTransform">
							<option id="effectTextTransformNone" value="none">
							</option><option id="effectTextTransformUppercase" value="uppercase">
							</option><option id="effectTextTransformLowercase" value="lowercase">
							</option><option id="effectTextTransformCapitalize" value="capitalize">
						</option></select>
					</td>
				</tr>
				<tr>
					<td><label for="effectStrokePref"></label></td>
					<td>
						<input class="option" id="effectStrokePref" type="checkbox">
					</td>
				</tr>
				<tr data-parent="effectStrokePref">
					<td><label for="effectStrokeWidth"></label></td>
					<td>
						<input class="option" id="effectStrokeWidth" type="range" min="0" max="0.5" step="0.025">
						<output id="effectStrokeWidthOutput" for="effectStrokeWidth" name="x">
					</output></td>
				</tr>
				<tr data-parent="effectStrokePref">
					<td><label for="effectStrokeColor"></label></td>
					<td>
						<input class="option" id="effectStrokeColor" type="color">
					</td>
				</tr>
				<tr>
					<td><label for="effectShadowPref"></label></td>
					<td>
						<input class="option" id="effectShadowPref" type="checkbox">
					</td>
				</tr>
				<tr data-parent="effectShadowPref">
					<td><label for="effectShadowOffsetX"></label></td>
					<td>
						<input class="option" id="effectShadowOffsetX" type="range" min="-0.25" max="0.25" step="0.01">
						<output id="effectShadowOffsetXOutput" for="effectShadowOffsetX" name="x">
					</output></td>
				</tr>
				<tr data-parent="effectShadowPref">
					<td><label for="effectShadowOffsetY"></label></td>
					<td>
						<input class="option" id="effectShadowOffsetY" type="range" min="-0.25" max="0.25" step="0.01">
						<output id="effectShadowOffsetYOutput" for="effectShadowOffsetY" name="x">
					</output></td>
				</tr>
				<tr data-parent="effectShadowPref">
					<td><label for="effectShadowBlur"></label></td>
					<td>
						<input class="option" id="effectShadowBlur" type="range" min="0" max="0.75" step="0.05">
						<output id="effectShadowBlurOutput" for="effectShadowBlur" name="x">
					</output></td>
				</tr>
				<tr data-parent="effectShadowPref">
					<td><label for="effectShadowColor"></label></td>
					<td>
						<input class="option" id="effectShadowColor" type="color">
					</td>
				</tr>
				<tr data-parent="effectShadowPref">
					<td><label for="effectShadowOpacity"></label></td>
					<td>
						<input class="option" id="effectShadowOpacity" type="range" min="0" max="100" step="5">
						<output id="effectShadowOpacityOutput" for="effectShadowOpacity" name="%">
					</output></td>
				</tr>
				<tr>
					<td><label for="effectTextBlurPref"></label></td>
					<td>
						<input class="option" id="effectTextBlurPref" type="checkbox">
						<input class="option" id="effectTextBlur" type="range" min="0" max="0.1" step="0.01" data-parent="effectTextBlurPref">
						<output id="effectTextBlurOutput" for="effectTextBlur" name="x" data-parent="effectTextBlurPref">
					</output></td>
				</tr>
				<tr>
					<td><h3 id="headerBg"></h3></td>
				</tr>
				<tr>
					<td><label for="backgroundType"></label></td>
					<td>
						<select class="option" id="backgroundType">
							<option id="backgroundTypeBg" value="background">
							</option><option id="backgroundTypeWindow" value="window">
						</option></select>
					</td>
				</tr>
				<tr>
					<td><label for="backgroundColorOpacityPref"></label></td>
					<td>
						<input class="option" id="backgroundColorOpacityPref" type="checkbox">
					</td>
				</tr>
				<tr data-parent="backgroundColorOpacityPref">
					<td><label for="backgroundColor"></label></td>
					<td>
						<input class="option" id="backgroundColor" type="color">
					</td>
				</tr>
				<tr data-parent="backgroundColorOpacityPref">
					<td><label for="backgroundOpacity"></label></td>
					<td>
						<input class="option" id="backgroundOpacity" type="range" min="0" max="100" step="5">
						<output id="backgroundOpacityOutput" for="backgroundOpacity" name="%">
					</output></td>
				</tr>
				<tr>
					<td><label for="backgroundPaddingPref"></label></td>
					<td>
						<input class="option" id="backgroundPaddingPref" type="checkbox">
						<input class="option" id="backgroundPadding" type="range" min="0" max="3" step="0.1" data-parent="backgroundPaddingPref">
						<output id="backgroundPaddingOutput" for="backgroundPadding" name="x" data-parent="backgroundPaddingPref">
					</output></td>
				</tr>
				<tr>
					<td><label for="backgroundRadiusPref"></label></td>
					<td>
						<input class="option" id="backgroundRadiusPref" type="checkbox">
						<input class="option" id="backgroundRadius" type="range" min="0" max="5" step="0.1" data-parent="backgroundRadiusPref">
						<output id="backgroundRadiusOutput" for="backgroundRadius" name="x" data-parent="backgroundRadiusPref">
					</output></td>
				</tr>
			</tbody>
		</table>
		<div id="previewContainer">
			<div class="caption-window">
				<p class="caption-segment" id="previewText">
			</p></div>
		</div>

	</body>
</html>
